[pytest]
# Pytest configuration for TN-NTN coexistence project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    -rs
    --tb=short
    --strict-markers
    --disable-warnings

# Show summary of test results
console_output_style = progress

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for modules
    slow: Slow tests that take >1 second (skip with: pytest -m "not slow")
    channel: Tests for channel_models module
    system: Tests for system_model module
    sinr: Tests for sinr_engine module

# Timeout (optional, requires pytest-timeout)
# timeout = 300

# Minimal verbosity for CI/CD
# You can set different output for local vs CI via environment variable
